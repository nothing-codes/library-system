<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мои книги — Библиотека</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" id="brand">Библиотека</div>
      <button id="logout-btn">Выйти</button>
    </div>
  </header>

  <div class="reader-layout">

    <section class="section grow">
      <div class="section-header">
        <h2>Каталог</h2>
        <div class="toolbar">
          <input type="text" id="catalog-search" placeholder="Поиск" class="search-input" />
        </div>
      </div>
      <div class="section-body">
        <table>
          <thead>
            <tr>
              <th>Название</th>
              <th>Автор</th>
              <th style="width:60px">Год</th>
              <th>ISBN</th>
              <th style="width:90px">Кол-во</th>
            </tr>
          </thead>
          <tbody id="catalog-tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="section grow">
      <div class="tabs">
        <button class="tab active" data-tab="my">Мои книги</button>
        <button class="tab" data-tab="recs">Рекомендации</button>
      </div>

      <div class="section-body" id="tab-my">
        <table>
          <thead>
            <tr>
              <th>Название</th>
              <th>Автор</th>
              <th>Выдана</th>
              <th>Окончание</th>
              <th>Статус</th>
            </tr>
          </thead>
          <tbody id="my-books-tbody"></tbody>
        </table>
      </div>

      <div class="section-body hidden" id="tab-recs">
        <table>
          <thead>
            <tr><th>Название</th><th>Автор</th><th style="width:60px">Год</th></tr>
          </thead>
          <tbody id="recs-tbody"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script type="module" src="/reader.js"></script>
</body>
</html>
